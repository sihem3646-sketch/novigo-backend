# render.yaml — Blueprint de déploiement du backend Novigo sur Render.
# Render lit ce fichier et crée un service web Node. Les clés secrètes ont
# `sync: false` : elles ne sont PAS dans le code, tu les saisiras dans le
# tableau de bord Render (Environment) — elles restent privées.
services:
  - type: web
    name: novigo-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Secrets — à saisir dans Render (jamais dans le code).
      - key: MISTRAL_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      # Valeurs non secrètes — déjà remplies.
      - key: ELEVENLABS_VOICE_ID
        value: EXAVITQu4vr4xnSDxMaL
      - key: ELEVENLABS_MODEL
        value: eleven_multilingual_v2
      # Nova : mémoire et quotas dans Supabase (secrets à saisir dans Render).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Messages Nova par COMPTE : formule gratuite (par mois, et au plus par jour) ;
      # plafond global de coût ; sécurité INVISIBLE des codes testeur.
      - key: NOVA_FREE_MONTHLY_LIMIT
        value: "20"
      - key: NOVA_FREE_DAILY_LIMIT
        value: "5"
      - key: NOVA_GLOBAL_DAILY_LIMIT
        value: "3000"
      - key: NOVA_UNLIMITED_DAILY_LIMIT
        value: "500"
      # Sécurité (bêta adulte) : voix IA coupée, Nova réservée aux profils Adultes.
      - key: TTS_ENABLED
        value: "0"
      - key: BETA_ADULTS_ONLY
        value: "1"
      # Origines de navigateur autorisées : liste par défaut dans lib/cors.js
      # (novigo.expo.app, mynovigo.fr, www.mynovigo.fr). Pour ajouter une adresse
      # d'aperçu PRÉCISE, renseigner ALLOWED_ORIGINS (liste complète, sans joker).
      # TRUST_PROXY_HOPS : nombre de relais devant le serveur (à confirmer chez Render).
      # PORT est fourni automatiquement par Render (le serveur le lit déjà).
