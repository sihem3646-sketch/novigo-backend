# render.yaml — Blueprint de déploiement du backend Novigo sur Render.
# Render lit ce fichier et crée un service web Node. Les clés secrètes ont
# `sync: false` : elles ne sont PAS dans le code, tu les saisiras dans le
# tableau de bord Render (Environment) — elles restent privées.
services:
  - type: web
    name: novigo-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Secrets — à saisir dans Render (jamais dans le code).
      - key: MISTRAL_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      # Valeurs non secrètes — déjà remplies.
      - key: ELEVENLABS_VOICE_ID
        value: EXAVITQu4vr4xnSDxMaL
      - key: ELEVENLABS_MODEL
        value: eleven_multilingual_v2
      # Anciennes versions de l'app (sans identifiant d'appareil) : identité par IP
      # hachée. À vider quand toutes les apps sont à jour.
      - key: NOVA_DEV_USER
        value: dev-1
      # Messages Nova par jour : gratuit (par appareil, affiché dans l'app) ; plafond
      # global des gratuits ; sécurité INVISIBLE des illimités (code testeur, abonnés).
      - key: NOVA_DAILY_LIMIT
        value: "20"
      - key: NOVA_GLOBAL_DAILY_LIMIT
        value: "3000"
      - key: NOVA_UNLIMITED_DAILY_LIMIT
        value: "500"
      # PORT est fourni automatiquement par Render (le serveur le lit déjà).
